version: '3.8'

services:
  library-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: library-management-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    restart: unless-stopped
    networks:
      - library-network

networks:
  library-network:
    driver: bridge
