services:
  library-api:
    build:
      context: .
      dockerfile: LibraryManagementAPI/Dockerfile
    container_name: library-management-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    volumes:
      - library-data:/app
    restart: unless-stopped
    networks:
      - library-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/authors || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  library-data:
    driver: local

networks:
  library-network:
    driver: bridge
